packages:
  - "apps/*"
  - "packages/*"
# vitest 5.0.0 (+ its internal packages) was published 2026-09-03 — the same day
# as ticket M0-T1 — and trips pnpm's default minimum-release-age supply-chain
# guard, failing install. Exact-version carve-out for a dev-only test runner;
# becomes a no-op and can be removed once these versions age past the cutoff.
# Review finding on M0-T1.
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0

# Security overrides (rule 11: no new package; transitive pins only).
# brace-expansion DoS advisories GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7
# (2026-09-30), reached only through minimatch under eslint-plugin-import-x and
# Expo config/CLI tooling. Remove once the parents pull the patched majors.
overrides:
  "brace-expansion@<2": "^1.1.20"
  "brace-expansion@>=2 <3": "^2.1.6"
  "brace-expansion@>=4 <5.0.11": "^5.0.11"

# Audit exceptions (recorded in CONTRIBUTING.md "Dependency audit"). Each entry
# names the advisory, why it does not reach shipped code, and when to remove it.
# GHSA-86w9-cpqp-85rv node-forge (2026-10-01): RSA PKCS#1 v1.5 signature
# verification; no patched version published. Reached only through @expo/cli
# and @expo/code-signing-certificates (the dev server's code signing), never
# bundled into the app by Metro and not a dependency of the API. Remove the
# day a patched node-forge exists or Expo drops it; re-check at every Expo bump.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
# GHSA-vfj7-8cjw-p6xm braces (2026-10-03): stack exhaustion on deeply nested
# glob patterns; no patched version published. Reached only through Metro's
# file map (micromatch) and other dev tooling; zero paths from the API's
# production dependencies. Remove when a patched braces exists.
    - GHSA-vfj7-8cjw-p6xm

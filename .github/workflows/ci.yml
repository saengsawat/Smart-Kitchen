name: CI

on:
  push:
  pull_request:
    branches:
      - main

# Cancel superseded runs on the same branch so demo/short-lived branches
# don't queue up stacked runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        # No `version` input: pnpm/action-setup errors if it's given alongside
        # package.json's "packageManager" field (even a satisfying prefix like
        # "12"), so this reads pnpm@12.3.1 from packageManager instead — the
        # exact version, sourced from the one place it's declared.

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      # This IS the lockfile-drift gate: --frozen-lockfile fails the run if
      # package.json and pnpm-lock.yaml have diverged.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (incl. packages/domain dependency-boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Dependency audit (high+ severity)
        run: pnpm audit --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # gitleaks scans the full commit range in the push/PR; shallow
          # history would hide leaks in earlier commits of the same push.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

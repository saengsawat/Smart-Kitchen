name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel superseded runs on the same branch so demo/short-lived branches
# don't queue up stacked runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    # Postgres for the M1-T2 database suites. Docker is not installed on the
    # development machine, so those suites skip locally (loudly) and CI is the
    # gate: `DATABASE_URL` is set on the test step below, and
    # apps/api/src/db/ci-guard.test.ts FAILS the build if it is ever missing
    # here — a green run can never mean "the schema was not tested".
    #
    # Credentials: there are none. `POSTGRES_HOST_AUTH_METHOD: trust` lets the
    # throwaway container accept local connections without a password, so no
    # secret (and nothing that looks like one) enters the repo — CLAUDE.md
    # rule 12. The container is destroyed with the job; no cloud resource is
    # created (rule 17).
    #
    # Pinned by digest (M1-T10-b) rather than the floating `17-alpine` tag, so
    # a tag repoint upstream cannot silently change what CI tests against. To
    # bump: obtain a fresh digest read-only from the registry (no Docker
    # needed) —
    #   TOKEN=$(curl -s \
    #     "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull" \
    #     | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).token))")
    #   curl -s -D - -o /dev/null "https://registry-1.docker.io/v2/library/postgres/manifests/17-alpine" \
    #     -H "Authorization: Bearer $TOKEN" \
    #     -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.index.v1+json"
    # and copy the `docker-content-digest` response header into the `image:`
    # line below (keep the `postgres:17-alpine@` prefix for a human-readable
    # tag alongside the digest that actually pins it).
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: smart_kitchen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        # No `version` input: pnpm/action-setup errors if it's given alongside
        # package.json's "packageManager" field (even a satisfying prefix like
        # "12"), so this reads pnpm@12.3.4 from packageManager instead — the
        # exact version, sourced from the one place it's declared.

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"
          cache: "pnpm"

      # This IS the lockfile-drift gate: --frozen-lockfile fails the run if
      # package.json and pnpm-lock.yaml have diverged.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (incl. packages/domain dependency-boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Each database test file creates and drops its own throwaway database on
      # this server, so DATABASE_URL points at the container's default database
      # and is used only to connect and issue CREATE DATABASE.
      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/smart_kitchen_ci

      - name: Mobile export smoke check (M3-T1)
        run: pnpm --filter mobile export

      - name: Format check
        run: pnpm format:check

      - name: Dependency audit (high+ severity)
        run: pnpm audit --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # gitleaks scans the full commit range in the push/PR; shallow
          # history would hide leaks in earlier commits of the same push.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
